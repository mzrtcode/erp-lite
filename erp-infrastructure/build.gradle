// 📦 Este módulo es una librería, no una app ejecutable

plugins {
    id 'java-library'
}

dependencies {
    // 🔗 Módulos propios que otros módulos pueden usar
    // api = me exporto como API para otros módulos
    api project(':erp-domain')
    api project(':erp-common')
    api project(':erp-application')

    // 🧩 Dependencias internas de Spring
    // implementation = uso interno, no lo expongo
    api 'org.springframework.boot:spring-boot-starter-data-jpa'
    api 'org.postgresql:postgresql:42.7.11'
    api 'org.springframework.boot:spring-boot-starter-web'

    // 🗄️ Mongo
    api 'org.springframework.boot:spring-boot-starter-data-mongodb'

    // ⚡ Redis
    api 'org.springframework.boot:spring-boot-starter-data-redis'
    api 'org.springframework.boot:spring-boot-starter-cache'

    // ✅ Validación
    api 'org.springframework.boot:spring-boot-starter-validation'

    // ☁️ AWS
    api "software.amazon.awssdk:s3:2.47.4"
}
